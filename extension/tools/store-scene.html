<!doctype html>
<!--
  One Chrome Web Store screenshot (1280 x 800), rendered by store-images.mjs.
  ?view=search|options  &theme=light|dark  &zoom=<percent>  &cap=<caption html>  &s=<scenario json, see store-stub.js>
  The panel is the real search.html / options.html running against a fake chrome.* API. The overlay is
  built the way background.js builds it (dim layer, frost layer, iframe), over a made-up grey page.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; --block: #edf0f4; --block2: #e4e8ee; --ink: #14171d; --hit: #1f5fd6; }
  [data-theme="dark"] { --bg: #181b21; --block: #232832; --block2: #2b313c; --ink: #eceef2; --hit: #9cbcff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: var(--bg); font-family: Geist, system-ui, sans-serif; }
  /* a made-up page behind the overlay: nav bar, sidebar, article lines, cards */
  .page { position: absolute; inset: 0; }
  .page i { position: absolute; display: block; background: var(--block); border-radius: 6px; }
  .page .d { background: var(--block2); }
  .cap { position: absolute; z-index: 3; left: 0; right: 0; top: 56px; margin: 0; text-align: center; color: var(--ink);
    font: 400 50px/1.1 "Instrument Serif", serif; letter-spacing: -.01em; }
  .cap em { color: var(--hit); }
  .ov { position: absolute; inset: 0; z-index: 2; }
  .scrim { position: absolute; inset: 0; }
  .box { position: absolute; left: 50%; transform: translateX(-50%); }
  .frost { box-shadow: 0 30px 80px rgb(0 0 0 / .25); }
  iframe { border: 0; }
  /* options view: the settings page in a plain window card */
  .win { position: absolute; z-index: 2; left: 50%; top: 140px; transform: translateX(-50%); background: #fff; border-radius: 14px;
    box-shadow: 0 30px 80px rgb(15 20 30 / .14), 0 0 0 1px rgb(15 20 30 / .08); overflow: hidden; }
  .win .bar { height: 40px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e4e7ec; font: 500 13px Geist, sans-serif; color: #5f6672; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<h1 class="cap" id="cap"></h1>
<script>
  const q = new URLSearchParams(location.search);
  const view = q.get("view") ?? "search", theme = q.get("theme") ?? "light";
  const zoom = +(q.get("zoom") ?? 100) / 100, s = q.get("s") ?? "{}";
  const dark = theme === "dark";
  document.documentElement.dataset.theme = theme;
  document.getElementById("cap").innerHTML = q.get("cap") ?? "";

  // The grey page: a header bar, a left column, article lines, right cards.
  const blocks = [[24,20,90,20,"d"],[1000,20,70,20,""],[1090,20,70,20,""],[1180,20,70,20,""],
    [40,92,200,18,"d"],[40,130,170,12,""],[40,158,190,12,""],[40,186,150,12,""],[40,214,180,12,""],[40,242,160,12,""],[40,290,200,18,"d"],[40,328,180,12,""],[40,356,150,12,""],[40,384,190,12,""],
    [1020,92,220,130,""],[1020,242,220,130,""],[1020,392,220,130,""],
    [300,150,680,14,""],[300,180,640,14,""],[300,210,660,14,""],[300,240,520,14,""],
    [300,300,680,200,"d"],[300,530,660,14,""],[300,560,600,14,""],[300,590,640,14,""],[300,620,500,14,""],[300,670,640,14,""],[300,700,560,14,""]];
  document.getElementById("page").innerHTML = blocks.map(([x,y,w,h,c]) => `<i class="${c}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></i>`).join("");

  const ov = document.createElement("div");
  if (view === "search") {
    // Same layers and numbers as overlay() in background.js, panel placed under the caption.
    const W = 640 * zoom, H = 480 * zoom, top = +(q.get("top") ?? 170), r = 16 * zoom;
    ov.className = "ov";
    ov.innerHTML = `<div class="scrim"></div><div class="box frost"></div><iframe class="box"></iframe>`;
    const [scrim, frost, f] = ov.children;
    scrim.style.cssText = `background:${dark ? "rgb(0 0 0/.32)" : "rgb(20 24 32/.12)"};backdrop-filter:blur(3px)`;
    for (const b of [frost, f]) b.style.cssText = `top:${top}px;width:${W}px;height:${H}px;border-radius:${r}px`;
    frost.style.backdropFilter = `blur(24px) saturate(1.3) brightness(${dark ? .7 : 1.15})`;
    f.style.colorScheme = dark ? "dark" : "light";
    f.style.background = "transparent";
    f.src = `/ext/search.html?w=1&t=${theme}&s=${encodeURIComponent(s)}`;
    document.body.append(ov);
  } else {
    const win = document.createElement("div");
    win.className = "win";
    win.style.zoom = zoom;
    win.innerHTML = `<div class="bar">TabNow options</div><iframe src="/ext/options.html?s=${encodeURIComponent(s)}" style="width:500px;height:672px;display:block"></iframe>`;
    document.body.append(win);
  }
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TabNow</title>
<link rel="stylesheet" href="search.css">
</head>
<body>
<div class="ov">
  <label class="q"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" autocomplete="off" autofocus></label>
  <ul></ul>
  <div class="foot">
    <span class="k"><kbd>↑</kbd><kbd>↓</kbd><b class="or"></b><kbd>ctrl</kbd><kbd>J</kbd><kbd>K</kbd> <i data-m="footNav"></i></span>
    <span class="k"><kbd>↵</kbd> <i data-m="footSwitch"></i></span>
    <span class="k opt"><kbd>ctrl</kbd><kbd>U</kbd> <i data-m="footClear"></i></span>
    <span class="k opt"><kbd>ctrl</kbd><kbd>⌫</kbd> <i data-m="footClose"></i></span>
    <span class="k end"><kbd>esc</kbd> <i data-m="footDismiss"></i></span>
  </div>
</div>
<script type="module" src="search.js"></script>
</body>
</html>

# nginx config for tabnow.app. Modelled on pigmo and stepkeep.
#
# Astro builds every page as a directory (build.format 'directory', trailingSlash 'always'), so
# `/privacy/` is `privacy/index.html` and the canonical URLs end in a slash. nginx adds that slash
# itself when a directory is asked for without it (a 301). Assets under `_astro/` carry a content
# hash in their name, so they may be cached for a year; everything else keeps short or no caching.
server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # TLS ends at the ingress, so nginx sees plain http. A relative Location keeps the visitor on
    # https for the trailing-slash redirect instead of bouncing through http.
    absolute_redirect off;

    charset utf-8;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # HSTS: one year, this host only. It is repeated in every location because an add_header
    # inside a location drops the ones set at server level.

    # A real 404 status for an unknown path, with Astro's 404 page as the body.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Content-hashed build assets: safe to keep for a year.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }


    # Pages carry canonical and hreflang links, so a stale copy is a correctness problem.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Everything else has a stable name: an hour, then revalidate.
    location ~* \.(?:css|js|mjs|woff2?|png|jpe?g|webp|avif|svg|ico|txt|xml|json|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }
}
